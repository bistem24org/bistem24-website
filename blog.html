
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blogs & Insights | BiSTEM24</title>
    <meta name="description" content="Explore BiSTEM24 articles on STEM education, classroom technology, innovative learning and spatial skills.">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/blog.css">
</head>
<body>

    <div id="site-header"></div>

    <main class="blog-page">
        <section class="blog-hero">
            <div class="blog-hero-inner">
                <span class="eyebrow">BISTEM24 · KNOWLEDGE &amp; IDEAS</span>
                <h1 id="hero-title">Blogs &amp; Insights</h1>
                <p id="hero-description">
                    Ideas, stories and insights that inspire learning,
                    innovation and opportunities in STEM.
                </p>
                <span class="hero-underline"></span>
            </div>
        </section>

        <section class="blog-listing" id="blog-listing">
            <div class="blog-container">
                <div class="section-heading">
                    <div>
                        <span class="eyebrow">EXPLORE OUR ARTICLES</span>
                        <h2>Ideas that inspire learning</h2>
                    </div>
                    <p></p>
                </div>

                <div class="blog-grid" id="blog-grid"></div>
            </div>
        </section>

        <section class="article-section" id="article-section" hidden>
            <div class="article-container">
                <a class="return-blogs" href="blog.html">
                    <span aria-hidden="true">←</span> Return to Blogs
                </a>

                <article class="article">
                    <header class="article-header">
                        <span class="article-category" id="article-category"></span>
                        <h1 id="article-title"></h1>
                        <p class="article-summary" id="article-summary"></p>

                        <div class="article-meta">
                            <span id="article-author"></span>
                            <span class="meta-dot">•</span>
                            <time id="article-date"></time>
                        </div>
                    </header>

                    <img class="article-cover" id="article-cover" src="" alt="">

                    <div class="article-content" id="article-content"></div>

                    <a class="return-blogs return-bottom" href="blog.html">
                        <span aria-hidden="true">←</span> Return to Blogs
                    </a>
                </article>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
